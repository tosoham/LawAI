[pytest]
# Imports are rooted at backend/ (the app uses `from services...`, `from agents...`),
# so tests must resolve modules the same way — otherwise the module-level singletons
# would be instantiated twice under two different module names.
pythonpath = .
testpaths = tests
asyncio_mode = strict
markers =
    live: tests that make real network calls to the AIML API (deselect with '-m "not live"')
    integration: tests that exercise several components together
    e2e: end-to-end tests requiring a running server and real credentials
filterwarnings =
    ignore::DeprecationWarning
